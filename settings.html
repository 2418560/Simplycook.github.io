<header>
  <h1>Accessibility Settings</h1>
</header>

<main id="main">

  <form>

    <fieldset>
      <legend>Theme</legend>
      <label>
        <input type="radio" name="theme" checked>
        Light mode
      </label>
      <label>
        <input type="radio" name="theme">
        Dark mode
      </label>
    </fieldset>

    <fieldset>
      <legend>Text Size</legend>
      <label>
        <input type="checkbox">
        Large text
      </label>
    </fieldset>

    <fieldset>
      <legend>Images</legend>
      <label>
        <input type="checkbox" checked>
        Show images
      </label>
    </fieldset>

    <button type="submit">Save settings</button>

  </form>

</main>

</body>
</html>
